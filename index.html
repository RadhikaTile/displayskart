<section><div class="w g2">${img(16,600,480)}<div><small class="cl">Who we serve</small><h2 style="font-size:32px;margin:6px 0 14px">Trusted by businesses &amp; institutions across India</h2><ul style="padding-left:18px"><li><b>Retail Shops</b> — risers, sign holders</li><li><b>Hotels &amp; Restaurants</b> — menu &amp; napkin holders</li><li><b>Offices</b> — name plates, organizers</li><li><b>NGOs &amp; Temples</b> — donation boxes with lock</li><li><b>Exhibitions</b> · <b>Galleries &amp; Museums</b></li></ul><p style="color:var(--mute)">Whether you need 10 pieces or 1,000, we deliver pan-India with 5% off bulk orders.</p><a class="btn fill" href="#/applications">Explore Applications</a></div></div></section>
<section><div class="w">${sec("Collection","Suggestion &amp; Donation Box")}<div class="g4">${L("don").slice(0,4).map(card).join("")}</div></div></section>
<section style="background:var(--cream)"><div class="w">${sec("Reviews","What Customers Say","Dummy testimonials — replace with real reviews")}<div class="g3">${[["Great clarity and sturdy build. The A4 sign holders look premium on our reception desk.","Rahul S. · Office Admin"],["Ordered donation boxes in bulk for our trust. Delivery was quick and the lock works well.","Meera K. · NGO Coordinator"],["The riser stands lifted our counter display. Will reorder for all our outlets.","Imran A. · Retail Owner"]].map(([t,n])=>`<div class="tm"><div style="color:#e0a526">★★★★★</div><p>“${t}”</p><b style="font-size:13px">${n}</b></div>`).join("")}</div></div></section>
<section><div class="w"><div class="sh"><h2>From the Blog</h2><a href="#/blog">All posts →</a></div><div class="g3">${B.slice(0,3).map(bcard).join("")}</div></div></section>
<section><div class="w g2" style="align-items:start"><div><small class="cl">FAQ</small><h2 style="font-size:32px;margin:6px 0 12px">Have questions or need assistance?</h2><p style="color:var(--mute)">Our team is here to help with personalized support &amp; expert advice.</p><a class="btn fill" href="#/contact">Contact Us</a></div><div>${faq.map((q,i)=>`<details ${i?"":"open"}><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("")}</div></div></section>
<section><div class="w">${sec("Follow us","@displayskart")}<div class="ig">${[3,6,9,12,15,18].map(s=>img(s,300,300)).join("")}</div></div></section>
<div class="cta" style="background:var(--cream)"><h2>Join our newsletter</h2><p style="color:var(--mute)">Offers and new arrivals, straight to your inbox.</p><div style="display:flex;gap:8px;max-width:440px;margin:auto"><input placeholder="Your email" style="border-radius:30px"><a class="btn fill" onclick="toast('Subscribed (demo)')">Subscribe</a></div></div>`;
let SS={};
function shop(k,q){SS={k,q,sort:"",max:12000};const ttl=q!=null?`Search: “${q}”`:(k&&CAT[k]?CAT[k]:"Shop All Products");
return`<div class="pgh"><div class="w">${crumb([["Shop","#/shop"],[ttl]])}<h1>${ttl}</h1></div></div><div class="w"><div class="shop"><aside class="side"><div class="bx"><h4>Categories</h4>${K.slice(0,8).map(c=>`<a class="${c==k?"on":""}" href="#/shop/${c}">${CAT[c]}</a>`).join("")}</div><div class="bx"><h4>Max price: <span id="mx">${f(12000)}</span></h4><input type="range" min="100" max="12000" step="100" value="12000" style="padding:0;border:0" oninput="SS.max=+this.value;$('#mx').textContent=f(SS.max);pg()"></div><div class="bx"><h4>Availability</h4><label style="display:block;font-size:14px"><input type="checkbox" style="width:auto" checked> In stock</label></div></aside><div><div class="bar"><span id="cn"></span><select onchange="SS.sort=this.value;pg()"><option value="">Default sorting</option><option value="a">Price: low to high</option><option value="d">Price: high to low</option></select></div><div class="g3" id="gr"></div></div></div></div>`}
function pg(){let it=SS.q!=null?ALL.filter(p=>p.t.toLowerCase().includes(SS.q.toLowerCase())):(SS.k&&CAT[SS.k]?L(SS.k):ALL);it=it.filter(p=>num(p)<=SS.max);if(SS.sort)it=[...it].sort((a,b)=>SS.sort=="a"?num(a)-num(b):num(b)-num(a));$("#cn").textContent=`Showing ${it.length} results`;$("#gr").innerHTML=it.length?it.map(card).join(""):"<p>No products found.</p>"}
function prod(id){const p=find(id)||L("sign")[0];rv=[p.id,...rv.filter(x=>x!=p.id)].slice(0,5);const ok=typeof p.n=="number",left=3+seed(p)%9;let h=prod0(id);
h=h.replace('<div style="font-size:13px;color:var(--mute)">Category:',`<p style="color:var(--sale);font-size:13px;margin:0 0 4px">🔥 Only ${left} items left in stock</p><div class="stk" style="margin-bottom:12px"><i style="width:${left*8}%"></i></div><div class="trust"><span>🚚 Free shipping ₹1000+</span><span>🔒 Secure payment</span><span>↩ Easy returns</span><span>🏷️ 5% bulk discount</span></div><div style="font-size:13px;color:var(--mute)">Category:`);
const rvh=rv.length>1?`<section><div class="sh"><h2>Recently Viewed</h2></div><div class="g4">${rv.filter(x=>x!=p.id).slice(0,4).map(x=>card(find(x))).join("")}</div></section>`:"";
return h.slice(0,-6)+rvh+`</div><div class="stk2"><span>${p.t.slice(0,50)}…</span><b>${f(p.n)}</b>${ok?`<a class="btn fill" onclick="add('${p.id}')">Add to cart</a>`:`<a class="btn fill" href="#/contact">Enquire</a>`}</div>`}
addEventListener("scroll",()=>{const e=$(".stk2");if(e)e.classList.toggle("on",scrollY>600)});
function route(){const[p,a]=(location.hash||"#/").slice(2).split("/").map(decodeURIComponent);
const c=!p?home():p=="shop"?shop(a):p=="search"?shop(null,a||""):p=="product"?prod(a):p=="cart"?cartPg():p=="blog"?(a?post(+a):blog()):p=="contact"?contact():p=="about"?about():p=="applications"?apps():p=="policy"?policy(a):p=="login"?login():home();
$("#app").innerHTML=hdr()+c+ftr();scrollTo(0,0);if($("#tp"))tab(0,document.querySelector(".tabs .on"));if($("#gr"))pg();tick()}

/* ===== Motion & polish layer ===== */
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches,q=s=>document.querySelector(s);
document.body.insertAdjacentHTML("beforeend",`<div id="pb"></div><a id="wa" href="https://wa.me/917900054449" target="_blank" title="Chat on WhatsApp">💬</a><button id="bt" title="Back to top" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>`);
document.addEventListener("load",e=>{if(e.target.tagName=="IMG")e.target.classList.add("ld")},true);
setTimeout(()=>document.querySelectorAll(".im img").forEach(i=>i.classList.add("ld")),5000);
function count(e){const to=+e.dataset.to,t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/1500),v=Math.round(to*(1-Math.pow(1-k,3)));e.textContent=(e.dataset.pre||"")+v.toLocaleString("en-IN")+(e.dataset.sfx||"");if(k<1)requestAnimationFrame(s)})(t0)}
const IO=typeof IntersectionObserver=="undefined"?null:new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;IO.unobserve(el);if(el.dataset.to)count(el);if(el.classList.contains("rv")){el.classList.add("in");setTimeout(()=>{el.classList.remove("rv","in");el.style.transitionDelay=""},1300)}}),{threshold:.1,rootMargin:"0px 0px -40px 0px"});
const SEL=".eyeh,.sh,.badges>div,.g3>*,.g4>*,.g2>*,.g5>*,.ig>*,.cdb,.lb,.steps>*,.stat2,.cta>*,.pd>*,.tabs,details,.crumb,h1.pt";
const MQ=["Acrylic Sign Holders","Photo Frames","Donation Boxes","Riser Stands","Brochure Holders","Name Plates","Wall Mount Frames","Label Holders"].map(x=>`<span>${x}</span>✦`).join("");
const STEPS=`<section><div class="w">${sec("Simple process","How to Order")}<div class="steps">${[["Choose","Browse sign holders, frames, donation boxes and more."],["Customise","Need a custom size or branding? Contact us for a quote."],["Pay Securely","Safe online payment with order confirmation."],["Delivered","Pan-India delivery — free shipping above ₹1000."]].map(([t,x],i)=>`<div class="stp"><span class="n">${i+1}</span><h3>${t}</h3><p>${x}</p></div>`).join("")}</div></div></section>`;
const STATS=`<section class="stats"><div class="w g4">${[[ALL.length,"","Products listed"],[8,"","Collections"],[5,"%","Bulk-order discount"],[1000,"₹","Free shipping above"]].map(([n,s,l])=>`<div class="stat2"><b class="cnt" data-to="${n}" data-pre="${l.startsWith("Free")?"₹":""}" data-sfx="${l.startsWith("Free")?"":s}">0</b><span>${l}</span></div>`).join("")}</div></section>`;
function after(){
document.querySelectorAll(".im img").forEach(i=>{if(i.complete&&i.naturalWidth)i.classList.add("ld")});
const cdb=q(".cdb");if(cdb&&!q(".mq"))cdb.closest("section").insertAdjacentHTML("beforebegin",`<div class="mq"><div>${MQ+MQ+MQ+MQ}</div></div>`);
const hl=q(".hl");if(hl&&!q(".steps"))hl.closest("section").insertAdjacentHTML("afterend",STEPS);
const tm=q(".tm");if(tm&&!q(".stats"))tm.closest("section").insertAdjacentHTML("beforebegin",STATS);
const c=q(".col2");if(c&&!q(".chip"))c.insertAdjacentHTML("beforeend",`<div class="chip a">🚚 Free shipping above ₹1000</div><div class="chip b">🏷️ 5% off bulk orders</div>`);
const m=q(".pd>div:first-child>.im");if(m){const th=document.querySelectorAll(".th .im");th.forEach(t=>t.onclick=()=>{const s=t.querySelector("img"),mi=m.querySelector("img");if(!s||!mi)return;th.forEach(x=>x.classList.remove("act"));t.classList.add("act");mi.style.opacity=0;mi.onload=()=>{mi.style.opacity=1};mi.src=s.src.replace("w=200&h=200","w=700&h=700")});m.onmousemove=e=>{const r=m.getBoundingClientRect(),i=m.querySelector("img");if(i)i.style.transformOrigin=((e.clientX-r.left)/r.width*100)+"% "+((e.clientY-r.top)/r.height*100)+"%"}}
if(!IO){document.querySelectorAll(".cnt").forEach(e=>e.textContent=(e.dataset.pre||"")+(+e.dataset.to).toLocaleString("en-IN")+(e.dataset.sfx||""));return}
if(RM){document.querySelectorAll(".cnt").forEach(e=>e.textContent=(e.dataset.pre||"")+(+e.dataset.to).toLocaleString("en-IN")+(e.dataset.sfx||""));return}
document.querySelectorAll(SEL).forEach(el=>{if(el.classList.contains("rv")||el.closest("header,#qm,#dr"))return;el.classList.add("rv");el.style.transitionDelay=([...el.parentNode.children].indexOf(el)%6)*90+"ms";IO.observe(el)});
document.querySelectorAll(".cnt").forEach(e=>IO.observe(e))}
const route1=route;route=function(){route1();after()};
const add1=add;add=function(...a){add1(...a);const e=q("#cc");if(e){e.classList.remove("bp");void e.offsetWidth;e.classList.add("bp")}};
const AN=["FREE SHIPPING ABOVE ₹1000 ORDERS","5% DISCOUNT ON BULK ORDERS","SECURE PAYMENT","HELP CENTER · +91 79000 54449"];let ai=0;
setInterval(()=>{const t=q(".top");if(!t)return;ai=(ai+1)%AN.length;t.innerHTML=`<span class="ms">${AN[ai]}</span>`},3500);
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest('.ac button[title="Wishlist"]');if(b){b.textContent=b.textContent=="♡"?"♥":"♡";b.style.color=b.textContent=="♥"?"var(--sale)":""}});
let tk=0;addEventListener("scroll",()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;q("#pb").style.width=(h>0?y/h*100:0)+"%";const hd=q("header.sticky");if(hd)hd.classList.toggle("sc",y>60);q("#bt").classList.toggle("on",y>700);const c=q(".col2");if(c&&!RM)c.style.transform=`translateY(${Math.min(y,800)*-.05}px)`})},{passive:true});

/* ===== Wishlist ===== */
let WL=new Set();try{WL=new Set(JSON.parse(localStorage.getItem("dk_wl")||"[]").filter(i=>{try{return find(i)}catch(e){return 0}}))}catch(e){}
const svw=()=>{try{localStorage.setItem("dk_wl",JSON.stringify([...WL]))}catch(e){}};
const hdr1=hdr;hdr=()=>hdr1().replace("<span>♡</span>",`<a href="#/wishlist" title="Wishlist">♡ <b id="wc">${WL.size}</b></a>`);
const card1=card;card=p=>card1(p).replace(`<button title="Wishlist" onclick="toast('Added to wishlist ♥')">♡</button>`,`<button title="Save to wishlist" style="${WL.has(p.id)?"color:var(--sale)":""}" onclick="wl('${p.id}',this)">${WL.has(p.id)?"♥":"♡"}</button>`);
function wl(id,b){const on=!WL.has(id);on?WL.add(id):WL.delete(id);svw();const c=$("#wc");if(c)c.textContent=WL.size;if(b){b.textContent=on?"♥":"♡";b.style.color=on?"var(--sale)":""}toast(on?"Added to wishlist ♥":"Removed from wishlist");if((location.hash||"").startsWith("#/wishlist"))route()}
const prod1=prod;prod=id=>prod1(id).replace(`<a class="btn" onclick="toast('Added to wishlist ♥')">♡ Wishlist</a>`,`<a class="btn" onclick="wl('${id}');this.textContent=WL.has('${id}')?'♥ In wishlist':'♡ Wishlist'">${WL.has(id)?"♥ In wishlist":"♡ Wishlist"}</a>`);
function wlp(){const it=[...WL].map(find);return`<div class="pgh"><div class="w">${crumb([["Wishlist"]])}<h1>My Wishlist (${it.length})</h1></div></div><div class="w">${it.length?`<div class="g4">${it.map(card).join("")}</div><p style="text-align:center;margin-top:26px"><a class="btn fill" onclick="it_all()">Add all to cart</a> &nbsp;<a class="btn" href="#/shop">Continue shopping</a></p>`:`<div class="bx2" style="text-align:center;padding:60px"><div style="font-size:44px">♡</div><h3>Your wishlist is empty</h3><p style="color:var(--mute)">Tap the heart on any product to save it here.</p><a class="btn fill" href="#/shop">Browse products</a></div>`}</div>`}
function it_all(){[...WL].filter(i=>typeof find(i).n=="number").forEach(i=>{cart[i]=(cart[i]||0)+1});$("#cc").textContent=cnt();opn()}
const route2=route;route=function(){if((location.hash||"").startsWith("#/wishlist")){$("#app").innerHTML=hdr()+wlp()+ftr();scrollTo(0,0);after()}else route2()};

/* wishlist: always-visible heart + quick-view heart */
const wl1=wl;wl=function(id,b){wl1(id,b);if(b){const on=WL.has(id);b.classList.toggle("on",on);b.classList.remove("hb");void b.offsetWidth;b.classList.add("hb");if(on)b.style.color=""}};
const card2=card;card=p=>card2(p).replace(`title="Save to wishlist" style="${WL.has(p.id)?"color:var(--sale)":""}"`,`title="Save to wishlist" aria-label="Save to wishlist" class="${WL.has(p.id)?"on":""}" style=""`);
const qv1=qv;qv=function(id){qv1(id);const d=$("#qc").lastElementChild;if(d)d.insertAdjacentHTML("beforeend",` <a class="btn" onclick="wl('${id}');this.textContent=WL.has('${id}')?'♥ In wishlist':'♡ Wishlist'">${WL.has(id)?"♥ In wishlist":"♡ Wishlist"}</a>`)};

addEventListener("hashchange",route);route();
</script></body></html>
